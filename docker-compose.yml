version: "3.9"

services:
  db:
    image: postgres:14
    container_name: payment_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: payment_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: payment_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: