databases:
  - name: portfolio-postgres
    plan: free
    region: frankfurt

services:
  - type: keyvalue
    name: portfolio-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: payment-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portfolio-redis
          property: connectionString
      - key: BUNQ_API_KEY
        sync: false
      - key: BUNQ_ENVIRONMENT
        value: SANDBOX
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["*"]'
