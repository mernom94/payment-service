[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Integration tests require a real PostgreSQL database.
# Set TEST_DATABASE_URL in your environment or a .env.test file:
#   TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/payment_test
#
# SQLite has been removed entirely. All tests run against PostgreSQL to
# exercise ON CONFLICT, SKIP LOCKED, CHECK constraints, and JSONB semantics.

addopts =
    --tb=short
    --strict-markers
    -q

markers =
    unit: Pure unit tests (no I/O)
    integration: Tests requiring a running PostgreSQL instance
    failure: Failure scenario tests
    slow: Tests that take more than 2 seconds

filterwarnings =
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:pydantic
