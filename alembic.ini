[alembic]
# Path to migration scripts
script_location = app/infrastructure/db/migrations

# SQLAlchemy URL is set programmatically in env.py from app settings.
# This placeholder is required by Alembic but overridden at runtime.
sqlalchemy.url = postgresql+asyncpg://placeholder

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
